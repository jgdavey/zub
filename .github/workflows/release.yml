name: Release

on:
  push:
    tags: ['v[0-9]+.*']

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')"
          echo "tag=$tag  Cargo.toml=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME (=$tag) does not match Cargo.toml version $crate" >&2
            exit 1
          fi

  create-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release (once)
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it as-is"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft --generate-notes --title "$GITHUB_REF_NAME"
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@cross
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target "${{ matrix.target }}" --bins
          else
            cargo build --release --target "${{ matrix.target }}" --bins
          fi
      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          name="zub-${version}-${target}"
          mkdir staging
          cp "target/${target}/release/zub" "target/${target}/release/zub-scaffold" staging/
          cp LICENSE README.md staging/
          tar czf "${name}.tar.gz" -C staging .
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Upload assets to draft release
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Mark release published
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
